name: CI

on:
  push:
    branches: [main]
    tags: ['shared-v*', 'studio-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: '22.19.0'
          - os: ubuntu-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
      - name: Install locked npm dependencies, including the local workspace
        run: npm ci
      - name: Install Python Office dependencies
        run: python -m pip install --requirement packages/artifact-services/python/requirements.txt
      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Select the shared test browser
        run: node scripts/prepare-test-runtime.mjs
      - name: Typecheck, build, test, audit, and pack both packages
        env:
          DSH_OFFICE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run check
      - name: Browser UI regression
        env:
          DSH_OFFICE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run test:ui
      - name: Isolated DSH 0.1.2-rc.1 host regression
        env:
          DSH_OFFICE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run test:host
      - name: Real PDF and video poster exports
        env:
          DSH_OFFICE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run test:exports
      - name: Upload package candidates and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            dist/packages/
            dist/reports/
            dist/ui/
            dist/exports/
            dist/host/
            test-results/
          if-no-files-found: warn
          retention-days: 14
